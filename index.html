<title>KOFUNE メニュー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Layout: title block, then a nav bar (Drink/Food switch + category chips) that sticks while scrolling,
   then a responsive card grid. Colours and type are the Canva menu's: white, black, #d0c2b6, Zen Kaku Gothic,
   hand-written tags, serif wordmark. Single committed light look, so no dark theme. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --band: #ae9e8e;
  --red: #ca4341;
  --green: #009C48;
  --mute: #6b6b6b;
  --mute: color-mix(in srgb, var(--ink) 58%, var(--paper));
  --tint: #f4f0ec;
  --tint: color-mix(in srgb, var(--band) 30%, var(--paper));
  --rule: rgba(0, 0, 0, 0.14);
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-hand: "Yusei Magic", "Zen Kurenaido", "Hiragino Maru Gothic ProN", cursive;
  --f-mark: "Cormorant Garamond", "Hoefler Text", Georgia, serif;
  --hdr: 100px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-weight: 400; font-size: 16px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 30; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* title */
.hero { position: relative; padding-block: 2.6rem 1.5rem; text-align: center; }
.langsw { position: absolute; right: var(--gutter-r); top: calc(0.8rem + env(safe-area-inset-top, 0px)); display: flex; border: 1px solid var(--ink); border-radius: 999px; padding: 2px; font-size: 0.78rem; }
.langsw button { background: none; border: 0; border-radius: 999px; padding: 0.15rem 0.7rem; font-weight: 400; letter-spacing: 0.04em; }
.langsw button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
h1 { margin: 0; line-height: 0; }
.logo { display: block; margin: 0 auto; width: clamp(38px, 10.5vw, 60px); height: auto; }
.sub { margin: 1.2rem 0 0; font-size: 0.95rem; font-weight: 400; letter-spacing: 0.6em; padding-left: 0.6em; }

/* nav: sticks under the status bar once the title scrolls away */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-block: 1px solid var(--rule);
}
.top .wrap { padding-block: 0.7rem 0.6rem; display: flex; flex-direction: column; gap: 0.6rem; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); border-radius: 999px; padding: 3px; max-width: 360px; width: 100%; margin: 0 auto; }
.tab { background: none; border: 0; border-radius: 999px; padding: 0.35rem 0.5rem; font-weight: 400; letter-spacing: 0.12em; transition: background 0.18s, color 0.18s; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.chips { position: relative; display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .chips { justify-content: center; } }
.cchip {
  flex: none; background: none; border: 1px solid var(--rule); border-radius: 999px;
  padding: 0.2rem 0.85rem; font-size: 0.85rem; font-weight: 400; white-space: nowrap;
  transition: background 0.18s, border-color 0.18s;
}
.cchip:hover { border-color: var(--ink); }
.cchip.on { background: var(--band); border-color: var(--ink); }

.notice {
  margin: 1.6rem auto 0; max-width: 34rem; padding: 0.35rem 1.1rem; text-align: left;
  border: 1px solid var(--ink); border-radius: 12px; font-size: 0.92rem; line-height: 1.6;
}
div.notice { display: grid; }
p.notice { text-align: center; border-style: dashed; padding: .8rem 1.1rem; }
.nrow { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; }
.nrow + .nrow { border-top: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
.nico { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.nico svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nrow b { font-weight: 500; text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 0.28em; }

/* sections */
.cat { margin-top: 2.6rem; scroll-margin-top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 12px); }
h2 { margin: 0 0 1rem; display: flex; align-items: baseline; gap: 0.2rem 0.8rem; flex-wrap: wrap; font-weight: 400; font-size: 1.25rem; letter-spacing: 0.03em; }
h2 .unit { font-size: 0.85rem; color: var(--mute); }
h2::after { content: ""; flex: 1 1 2rem; height: 1px; background: var(--rule); align-self: center; min-width: 2rem; }
.bubbles { position: absolute; z-index: 1; left: 0.9rem; top: -0.8rem; display: flex; gap: 0.5rem; }
.tag {
  position: relative; display: inline-block; padding: 0.14rem 0.7rem 0.16rem; border-radius: 999px;
  font-size: 0.74rem; font-weight: 500; line-height: 1.3; letter-spacing: 0.06em; white-space: nowrap;
  color: #fff; background: var(--red); border: 1.5px solid var(--red);
}
.tag::after { content: ""; position: absolute; left: 0.9rem; bottom: -0.34rem; width: 0.5rem; height: 0.5rem; background: inherit; border-right: 1.5px solid; border-bottom: 1.5px solid; border-color: inherit; transform: rotate(45deg) skewX(-10deg); border-bottom-right-radius: 2px; }
.tag.up { background: var(--green); border-color: var(--green); }
h2 .tag { order: 1; margin-left: 0; }
h2 .tag::after { display: none; }

.grid { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }

/* cards */
.card {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  padding: 0.95rem 1rem; transition: border-color 0.18s; position: relative;
}
.card.hasb { margin-top: 0.5rem; }
.card:hover { border-color: var(--ink); }
/* Tap No. block on the left, spanning title row and Brewer row; title + price on top, Brewer beneath */
.cardtop { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.9rem; align-items: stretch; }
.cardtop.notap { grid-template-columns: minmax(0, 1fr); }
.tapno {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
  min-width: 3.6rem; padding: 0.5rem 0.4rem; background: var(--ink); color: var(--paper); border-radius: 8px;
}
.tapno .lb { font-size: 0.64rem; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1; }
.tapno .n { font-size: 2.2rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.main { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 0.35rem; }
.row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 0.9rem; }
.ttl { min-width: 0; font-size: 1.2rem; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
.price { flex: none; font-size: 1.3rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.by { margin: 0; display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; letter-spacing: 0.03em; }
.by .lb { font-size: 0.82rem; font-weight: 400; color: var(--mute); }
.by b { font-size: 1.1rem; font-weight: 500; }
.meta { margin-top: 0.7rem; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
.pill { font-size: 0.88rem; font-weight: 400; background: var(--tint); border-radius: 999px; padding: 0.05rem 0.65rem; }
.alc { margin-left: auto; font-size: 0.95rem; font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.acts { margin-top: 0.7rem; display: flex; justify-content: flex-end; }
.card.tappable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.card.tappable .desc { cursor: text; }
.more { background: none; border: 0; padding: 0.3rem 0; font-size: 0.85rem; font-weight: 400; display: inline-flex; gap: 0.4rem; align-items: center; }
.more .car { display: inline-block; transition: transform 0.2s; }
.open .more .car { transform: rotate(180deg); }
.drop { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
.open .drop { grid-template-rows: 1fr; }
.dropin { overflow: hidden; visibility: hidden; transition: visibility 0.25s; }
.open .dropin { visibility: visible; }
.desc { margin: 0.7rem 0 0; padding-top: 0.7rem; border-top: 1px dashed var(--rule); font-size: 0.98rem; font-weight: 400; color: #1a1a1a; line-height: 1.9; white-space: pre-line; }
.card.compact { padding: 0.8rem 1rem; }
.card.compact .ttl { font-weight: 400; }

.card.sold { opacity: 0.6; }
.card.sold .ttl .nm, .card.sold .price { text-decoration: line-through; text-decoration-thickness: 1px; }
.soldtag { margin-left: 0.6rem; font-size: 0.72rem; letter-spacing: 0.1em; color: var(--mute); }

.syncrow { margin-top: 2.5rem; text-align: center; font-size: 0.78rem; color: var(--mute); }
.syncrow button { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 0.2rem 0.9rem; color: var(--mute); }
.syncrow p { margin: 0.5rem 0 0; }
footer.band { margin-top: 3.5rem; background: var(--band); }
.bandin { padding-block: 1.9rem; text-align: center; }
.mark { font-family: var(--f-mark); font-weight: 600; font-size: 1.15rem; letter-spacing: 0.26em; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .drop, .car, .tab, .cchip, .card, .dropin { transition: none; }
}
</style>

  // Snapshot of the master spreadsheet at publish time (same shape as Sheets get_values).
  var SNAP = {"categories":[["category_id","menu_type","sort","title","subtitle","unit_note","badges","visible","note","title_en"],["sake_tap","drink","1","SAKE on Tap","","90ml","","TRUE","メインのSAKE（樽生）","SAKE on Tap"],["sake_more","drink","2","More SAKE","","90ml","","TRUE","Tap以外のSAKE","More SAKE"],["beer","drink","3","Beer","","","","TRUE","","Beer"],["soft","drink","4","Soft Drink","","","","TRUE","","Soft Drink"],["f_season","food","1","季節限定","","","","TRUE","","Seasonal"],["f_quick","food","2","すぐ出る!","","","","TRUE","","Quick!"],["f_main","food","3","定番","","","","TRUE","","Standard"],["f_full","food","4","お腹を満たす!","","","","TRUE","","Hungry?"],["f_dessert","food","5","デザート","","","","TRUE","","Dessert"],["f_oden","food","1.5","酒粕おでん","","","","TRUE","","Sake Lees Oden"]],"items":[["item_id","category_id","sort","display_no","name","producer","ingredients","abv","description","price","badges","status","note","name_en","ingredients_en","description_en"],["d01","sake_tap","1","1","レモンパッション","Kai Tanaka","パッションフルーツ/レモン/黒糖","13","いつものレモンのSAKEに奄美大島産のパッションフルーツをふんだんに使用。黒糖も足してますが甘さよりかはミネラル感として。パッションフルーツのタネも一緒に漬け込んだので香りもいい感じにのってきました。暑い夏にピッタリのトロピカルなSAKEです。","1100","","available","","Lemon Passion","Passion fruit/Lemon/Brown sugar","Our signature Lemon SAKE, now generously infused with Amami Oshima passion fruit! We’ve added brown sugar—not to make it overly sweet, but to lend a subtle mineral flavor. Matured together with the passion fruit seeds, it now has a wonderful, uplifting fragrance. A truly tropical SAKE made for hot summer days!"],["d02","sake_tap","2","2","NEW ENERGY SAKE","Mutsuhiro Ueda","カカオハスク/生姜","10","ほのかな カカオの香りと生姜のスパイスが効いた、まるでエナジードリンクのような 限定SAKEが誕生しました。和歌山の [K 型 Chocolate Company]のカカオハスクを使用した刺激的な1杯です。","1000","","available","","NEW ENERGY SAKE","Cacao husk/Ginger","We’ve created a limited-edition sake with a subtle cacao aroma and a spicy kick of ginger. It’s an exciting drink, almost like an energy drink, made with cacao husks from K-type Chocolate Company in Wakayama."],["d03","sake_tap","3","3","Sparkling Lemon","Kai Tanaka","レモン/塩","13","遠くのものが出会うところに縁起があり、その縁起の距離がエネルギーを生むと、出雲の杜氏さんから聞いたことがある。鹿児島最南端の鰹節と北海道北端の利尻こんぶ、山のお蕎麦にかかせない海苔は海のもの。お米とレモン、似つかわない2つが合わさって何ができるか、そこに縁起は生まれるか。味わいくださいませ。","900","","available","","Sparkling Lemon","Lemon/Salt","I once heard from a master brewer in Izumo that \"engi\" (a fateful connection) arises where things from distant places meet, and the distance involved in that connection creates energy. Bonito flakes from the southernmost tip of Kagoshima and Rishiri kombu from the northernmost tip of Hokkaido; nori, essential for mountain soba noodles, comes from the sea. Rice and lemon—what can be created when these two seemingly disparate things come together? Will a fateful connection be born from this? Please savor it."],["d04","sake_tap","4","4","Team UEDA feat. “ue.”","Mutsuhiro Ueda","コーヒーかす/河内晩柑","10","新町のスペシャルティコーヒーのお店「ue.」さんのコーヒーかすを再利用。和製グレープフルーツと言われる河内晩柑の皮も加えてエスプレッソトニックのようなニュアンスをSAKEで表現してみました。","1000","","available","","Team UEDA feat. “ue.”","Coffee grounds/Kawachi-Bankan","We reused coffee grounds from \"ue.\", a specialty coffee shop in Shinmachi. By adding the peels of Kawachi Bankan, often referred to as Japanese grapefruit, we used SAKE to capture the nuances of an espresso tonic."],["d05","sake_tap","5","5","SceNt ~慈悲~","Naoya Suga","コブミカンの葉/鉄観音茶/青紫蘇/ココナッツ/白檀","12.5","すべての苦しみを取り除き、安らぎと喜びを与える「抜苦与楽」。仏教における慈悲の精神を、白檀を中心に静寂と温かさに満ちたボタニカルで表現しました。一口ごとに心が整い、自分自身と穏やかに向き合える時間をあなたに。","1100","","available","","SceNt ~慈悲 Jihi~","Makrut Lime Leaf/Tieguanyin Oolong Tea/Green Shiso/Coconut/Sandalwood","“Bakku Yoraku”—the act of relieving all suffering and granting peace and joy. Inspired by the Buddhist spirit of compassion, this spirit is crafted around sandalwood, blended with botanicals that radiate tranquility and warmth. With every sip, may your mind find balance and a moment of gentle reflection with yourself."],["d06","sake_tap","6","6","下らん酒","Mutsuhiro Ueda","乳酸菌","11","江戸時代に上方(関西エリア)で造られ、廻船で江戸へ運ばれた高品質なお酒を ”下り酒\" と言います。それをもじって直営パブ限定で流通するお酒のシリーズを \"下らん酒\" と名付けました。乳酸菌を副原料として使用することで税法上のその他の醸造酒の範囲の中で造る、”実質的な清酒”です。","800","","available","","下らん酒 Kudaran Sake","Lactobacillus","Sake brewed in the Kansai area during the Edo period and transported to Edo by cargo ship is called \"Kudari-sake\". It is said that its quality was high and it was very popular in Edo. As a play on words on that, we named this series of sake, distributed exclusively at our directly managed pub and other restaurants in Osaka, \"Kudaran-sake” (The opposite meaning of \"Kudari-sake\"). A pure, classic style sake brewed without using any flavor ingredients other than rice, rice koji, and microorganisms."],["d07","sake_more","1","","SceNt ~無垢~","Naoya Suga","りんご/青森ヒバ/トンカ豆","12","無垢が故に蛇に唆されたアダムとイブは禁断の果実を口にするという原罪を犯しました。純粋さとは時にとてつもない罪を犯します。罪というと禍々しいものを想像しますが、その実はとても純粋で甘々しいものなのではないのでしょうか。このお酒ではそんな無垢で魅惑的な香りを表現しました。","1000","","hidden","元デザインでは取り消し線（品切れ）","SceNt ~無垢 Muku~","Apple/Aomori cypress/Tonka beans","Because of their innocence, Adam and Eve were tempted by the serpent and committed the original sin of eating the forbidden fruit. Purity, at times, commits tremendous sins. When we speak of sin, we imagine something sinister, but perhaps its reality is something very pure and sweet. This sake expresses such an innocent and captivating aroma. It is paired with \"Hajirai\" (Shame), so please enjoy comparing the two."],["d08","sake_more","2","","SceNt ~慈愛~","Naoya Suga","ラベンダー/ビターオレンジ/キャラウェイ/カルダモン/バナナ/パチョリ","12.5","どんなに過ちを犯しても決して見捨てることのない無償の愛。キリスト教におけるAgapeの概念を愛や癒しに纏わるハーブを使用してお酒にしました。心地よく感じるか、針のように感じるかは貴方次第です。","1100","","available","","SceNt ~慈愛 Jiai~","Lavender/Bitter Orange/Caraway/Cardamom/Banana/Patchouli","Unconditional love that never abandons you, no matter what mistakes you make. This liqueur embodies the Christian concept of Agape, crafted with herbs associated with love and healing. Whether you find it comforting or sharp as a needle is entirely up to you."],["d09","sak       var text = p[0].replace(/^[※\s]+/, "");
      var ico = h("span", { class: "nico", "aria-hidden": "true" });
      ico.innerHTML = ICONS[idx] || ICONS[0];
      var tx = h("span", { class: "ntx" });
      var w = p[1], i = w ? text.indexOf(w) : -1;
      if (i >= 0) tx.append(text.slice(0, i), h("b", null, w), text.slice(i + w.length));
      else tx.append(text);
      n.append(h("div", { class: "nrow" }, ico, tx));
    });
    var r = document.documentElement.style;
    [["color_bg", "--paper"], ["color_text", "--ink"], ["color_accent", "--band"]].forEach(function (p) {
      if (/^#[0-9a-f]{6}$/i.test(S[p[0]] || "")) r.setProperty(p[1], S[p[0]]);
    });
  }
  function renderTabs() {
    ["drink", "food"].forEach(function (t) {
      var b = $("tab-" + t);
      b.setAttribute("aria-selected", state.tab === t ? "true" : "false");
      b.tabIndex = state.tab === t ? 0 : -1;
    });
    $("menu").setAttribute("aria-labelledby", "tab-" + state.tab);
  }
  function renderMenu() {
    var cats = M.cats.filter(function (c) { return c.menu_type === state.tab && c.items.length; });
    var menu = $("menu");
    menu.textContent = "";
    cats.forEach(function (c) { menu.append(sectionEl(c)); });
    if (!cats.length) menu.append(h("p", { class: "notice" }, "メニューを準備中です"));
    setupChips(cats);
  }
  function renderAll() { renderHead(); renderTabs(); renderMenu(); }

  // After switching tabs, bring the top of the list back under the sticky nav (only if scrolled past it).
  function toListTop() {
    var y = $("notice").getBoundingClientRect().top + window.scrollY - $("top").offsetHeight - 12;
    if (window.scrollY > y) window.scrollTo(0, Math.max(0, y));
  }
  function go(tab) {
    state.tab = tab === "food" ? "food" : "drink";
    try { if (location.hash.slice(1) !== state.tab) location.hash = state.tab; } catch (e) {}
    renderTabs(); renderMenu(); toListTop();
  }
  function fromHash() { return location.hash.slice(1) === "food" ? "food" : "drink"; }

  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { go(b.getAttribute("data-tab")); });
    b.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        var t = state.tab === "drink" ? "food" : "drink";
        go(t); $("tab-" + t).focus();
      }
    });
  });
  window.addEventListener("hashchange", function () {
    var t = fromHash();
    if (t !== state.tab) { state.tab = t; renderTabs(); renderMenu(); toListTop(); }
  });
  if ("ResizeObserver" in window) {
    new ResizeObserver(function () { document.documentElement.style.setProperty("--hdr", $("top").offsetHeight + "px"); }).observe($("top"));
  }

  function setLang(l, save) {
    state.lang = l === "en" ? "en" : "ja";
    if (save) { try { localStorage.setItem("kofune-menu-lang", state.lang); } catch (e) {} }
    renderAll();
    document.documentElement.style.setProperty("--hdr", $("top").offsetHeight + "px");
  }
  document.querySelectorAll(".langsw button").forEach(function (b) {
    b.addEventListener("click", function () { if (b.getAttribute("data-lang") !== state.lang) setLang(b.getAttribute("data-lang"), true); });
  });
  (function () {
    var l = null;
    try { l = localStorage.getItem("kofune-menu-lang"); } catch (e) {}
    if (l !== "ja" && l !== "en") l = /^ja\b/i.test(navigator.language || "ja") ? "ja" : "en";
    state.lang = l;
  })();

  state.tab = fromHash();
  renderAll();
  document.documentElement.style.setProperty("--hdr", $("top").offsetHeight + "px");

  // ---- automatic update from the master spreadsheet (via the Apps Script data window) ----
  // The page opens instantly with the last known menu, then swaps in the latest data if it differs.
  (function autoLoad() {
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 10000) : null;
    fetch(DATA_URL, { credentials: "omit", cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
      .then(function (raw) {
        if (!raw || !raw.categories || !raw.items) return;
        var m = build(raw);
        if (!m.cats.length) return;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(raw)); } catch (e) {}
        if (JSON.stringify(m) === JSON.stringify(M)) return;
        M = m;
        renderAll();
        document.documentElement.style.setProperty("--hdr", $("top").offsetHeight + "px");
      })
      .catch(function () {})
      .then(function () { if (timer) clearTimeout(timer); });
  })();

  // ---- optional live sync from the master spreadsheet (viewers with a Google Sheets connector) ----
  function syncMsg(t) { $("syncmsg").textContent = t; }
  function fmtTime(ms) { return new Date(ms).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
  async function readSheet(mcp, range) {
    var res = await mcp.callTool("Google Sheets", "get_values", { spreadsheetId: SHEET_ID, range: range }, { cache: false });
    var p = res && res.payload;
    return (p && p.values) || [];
  }
  async function sync(mcp) {
    var btn = $("syncbtn");
    btn.disabled = true;
    syncMsg("読み込み中…");
    try {
      var got = await Promise.all([
        readSheet(mcp, "categories!A1:J200"), readSheet(mcp, "items!A1:P500"),
        readSheet(mcp, "badges!A1:E50"), readSheet(mcp, "settings!A1:C80")
      ]);
      var m = build({ categories: got[0], items: got[1], badges: got[2], settings: got[3] });
      if (!m.cats.length) { syncMsg("シートにカテゴリがないため、表示は変更していません。"); return; }
      M = m;
      renderAll();
      syncMsg(fmtTime(Date.now()) + " にシートの内容を反映しました（この画面のみ）");
    } catch (err) {
      var code = err && err.code;
      if (code === "needs_reauth") syncMsg("Google Sheetsの再接続が必要です。claude.aiの設定 → コネクタから再接続してください。");
      else if (code === "server_not_connected") syncMsg("Google Sheetsコネクタが未接続です。claude.aiの設定 → コネクタから追加してください。");
      else if (code === "approval_required" || code === "not_in_manifest" || code === "consent_required") syncMsg("このページからのシート読み取りが許可されていません。");
      else syncMsg("シートを読み込めませんでした。公開時点のメニューを表示しています。");
    } finally { btn.disabled = false; }
  }
  (async function () {
    try {
      if (!window.claude || !window.claude.use) return;
      var mcp = await window.claude.use("mcp");
      if (!mcp) return;
      $("syncrow").hidden = false;
      $("syncbtn").addEventListener("click", function () { sync(mcp); });
    } catch (e) {}
  })();
})();
</script>

</body></html>
